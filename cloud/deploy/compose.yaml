# ROMKADE Cloud sur la droplet : joint le réseau du Caddy commun (licenses_web), aucun port publié.
# Caddy : site mcp.romkade.com -> romkade-cloud:8787 (caddy.site).
services:
  romkade-cloud:
    container_name: romkade-cloud
    image: romkade-cloud
    build:
      context: ../..
      dockerfile: cloud/deploy/Dockerfile
    restart: unless-stopped
    environment:
      ROMKADE_PUBLIC_URL: ${ROMKADE_PUBLIC_URL:-https://mcp.romkade.com}
      # Comptes ROMKADE (Supabase Auth, serveur OAuth) : adresse du projet et clé publique (pas des secrets).
      ROMKADE_SUPABASE_URL: https://urpvxqtyscuomkusqsiu.supabase.co
      ROMKADE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4TKxIKKsIU97CwTtATuckw_mhYMMlPq
      # Statistiques d'usage MCP (PostHog Cloud EU, projet RomKade) : clé publique du projet, pas un secret.
      POSTHOG_PROJECT_TOKEN: phc_yRwnSr3HGYSAiRtL4Q6baZw9H3ZXn886i86E28ATc9qv
      POSTHOG_HOST: https://eu.i.posthog.com
      # Vérification du domaine pour l'annuaire de ChatGPT (platform.openai.com/plugins) : jeton public, servi sur
      # /.well-known/openai-apps-challenge.
      ROMKADE_OPENAI_CHALLENGE: ""
    # Secrets du serveur (clé d'administration Supabase, pour supprimer un compte) : fichier de la droplet, hors dépôt
    # et hors déploiement (~/app/romkade-cloud/secrets.env, lisible par le seul compte de déploiement).
    env_file:
      - path: ../../secrets.env
        required: false
    volumes:
      - romkade_data:/data
    networks: [licenses_web]
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Console de démonstration (romkade_cloud/demo_console.py) : toujours en ligne, pour la Test Suite et la
  # certification Google Home. Son secret (ROMKADE_DEMO_SECRET) est dans secrets.env ; sans lui, elle attend.
  romkade-demo:
    container_name: romkade-demo
    image: romkade-cloud
    command: ["python", "-m", "romkade_cloud", "demo-console"]
    restart: unless-stopped
    depends_on: [romkade-cloud]
    environment:
      ROMKADE_DEMO_SERVER: http://romkade-cloud:8787
    env_file:
      - path: ../../secrets.env
        required: false
    healthcheck:
      disable: true
    networks: [licenses_web]
    mem_limit: 96m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  romkade_data: {}

networks:
  licenses_web:
    external: true
