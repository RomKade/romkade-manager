<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ROMKADE · Connexion</title>
<link rel="icon" href="/icon.png">
<!--
  Page ROMKADE de connexion et d'autorisation (OAuth 2.1, Supabase Auth). © 2026 ROMKADE, tous droits réservés.
  ChatGPT, Claude… envoient l'utilisateur sur Supabase Auth, qui le renvoie ici avec ?authorization_id=… :
  connexion (ou création du compte, mot de passe oublié, double authentification), puis « Autoriser » ou « Refuser ».
  Même charte que ROMKADE Manager. Le serveur remplace __SUPABASE_URL__ et __SUPABASE_KEY__ (clé publique).
-->
<style>
@font-face { font-family: "Archivo RK"; src: url("/fonts/archivo.woff2") format("woff2-variations"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
@font-face { font-family: "Digits RK"; src: url("/fonts/archivo.woff2") format("woff2-variations"); font-weight: 100 900; font-stretch: 62% 125%; unicode-range: U+0030-0039; font-display: swap; }
@font-face { font-family: "Atkinson RK"; src: url("/fonts/atkinson.woff2") format("woff2-variations"); font-weight: 200 800; font-display: swap; }
:root {
  color-scheme: dark;
  --shell: #050c1c; --panel: #0b1c35; --panel-2: #102642; --line: #234362; --line-strong: #31597f;
  --ink: #f5f8ff; --ink-2: #a9bdd3; --ink-3: #8aa1bb;
  --accent: #11d9f5; --accent-hover: #63e7f9; --accent-ink: #03141f; --accent-2: #ff43b5;
  --live: #b7ec4b; --ok: #34de95; --err: #f56a84; --err-soft: #3a1529;
  --glow-cyan: 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 22px color-mix(in srgb, var(--accent) 22%, transparent);
  --font-display: "Archivo RK", system-ui, sans-serif;
  --font-text: "Digits RK", "Atkinson RK", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font-text); color: var(--ink); line-height: 1.45; -webkit-font-smoothing: antialiased;
  background: radial-gradient(900px 420px at 85% -10%, rgb(17 217 245 / 0.12), transparent 70%),
              radial-gradient(800px 420px at 15% -20%, rgb(255 67 181 / 0.10), transparent 70%),
              linear-gradient(rgb(17 217 245 / 0.045) 1px, transparent 1px) 0 0 / 32px 32px,
              linear-gradient(90deg, rgb(17 217 245 / 0.045) 1px, transparent 1px) 0 0 / 32px 32px, var(--shell);
  display: grid; place-items: center; padding: 28px 16px;
}
main { width: 100%; max-width: 420px; }
.logo { display: block; height: 52px; margin: 0 auto 22px; filter: drop-shadow(0 0 14px rgb(17 217 245 / 0.35)); }
.card { background: linear-gradient(180deg, #0c1f3b, #0a1830); border: 1px solid var(--line); border-radius: 18px; padding: 24px 22px;
  box-shadow: 0 1px 0 rgb(255 255 255 / 0.03) inset, 0 24px 60px rgb(0 0 0 / 0.45); }
h1 { font-family: var(--font-display); font-weight: 750; font-stretch: 112%; font-size: 1.45rem; margin: 0 0 6px; letter-spacing: -0.01em; }
p { margin: 0 0 14px; }
.muted { color: var(--ink-2); font-size: 0.875rem; }
label { display: block; font-size: 0.8125rem; font-weight: 650; color: var(--ink-2); margin: 14px 0 6px; }
input[type=email], input[type=password], input[type=text] {
  width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  padding: 0 12px; font: inherit; outline: none; transition: border-color 180ms, box-shadow 180ms; }
input:focus { border-color: var(--accent); box-shadow: var(--glow-cyan); }
.code { letter-spacing: 0.5em; text-align: center; font-size: 1.4rem; font-family: var(--font-display); font-weight: 750; }
.btn { width: 100%; height: 44px; margin-top: 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  font: inherit; font-weight: 750; cursor: pointer; box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 30%, transparent); transition: background 180ms, transform 80ms; }
.btn:hover:not(:disabled) { background: var(--accent-hover); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn--ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); box-shadow: none; }
.btn--ghost:hover:not(:disabled) { background: var(--panel-2); border-color: var(--accent); }
.row { display: flex; gap: 10px; }
.row .btn { flex: 1; }
.links { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; font-size: 0.875rem; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; font-weight: 650; }
.link:disabled { color: var(--ink-3); cursor: default; }
.notice { margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 0.875rem; }
.notice--err { background: var(--err-soft); border: 1px solid color-mix(in srgb, var(--err) 45%, transparent); }
.notice--ok { background: color-mix(in srgb, var(--ok) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
.client { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); margin: 14px 0; }
.client img { width: 40px; height: 40px; border-radius: 9px; }
.client b { display: block; font-family: var(--font-display); font-size: 1.05rem; }
ul.perms { list-style: none; margin: 12px 0 0; padding: 0; }
ul.perms li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; font-size: 0.9rem; border-top: 1px solid var(--line); }
ul.perms li:first-child { border-top: 0; }
ul.perms li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px var(--live); }
.account { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 0.875rem; color: var(--ink-2); margin-top: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.8125rem; color: var(--ink-2); margin-top: 14px; font-weight: 400; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.check a, .foot a { color: var(--accent); }
.foot { text-align: center; font-size: 0.75rem; color: var(--ink-3); margin-top: 18px; }
.spin { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgb(17 217 245 / 0.25); border-top-color: var(--accent); animation: spin 0.8s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.hint { font-size: 0.75rem; color: var(--ink-3); margin-top: 6px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/romkade-logo.webp" alt="ROMKADE">
  <section class="card" id="card" aria-live="polite"><span class="spin" aria-hidden="true"></span></section>
  <p class="foot" id="foot"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
"use strict";
(() => {
const SUPABASE_URL = "__SUPABASE_URL__";
const SUPABASE_KEY = "__SUPABASE_KEY__";
const RESEND_SECONDS = 30;
const params = new URLSearchParams(location.search);
const authorizationId = params.get("authorization_id");
const card = document.getElementById("card");

/* ---------- textes ---------- */
const TEXT = {
  fr: {
    signinTitle: "Connexion à ROMKADE", signinSub: "Connecte-toi pour relier ta console à {client}.",
    email: "Adresse e-mail", password: "Mot de passe", signin: "Se connecter", forgot: "Mot de passe oublié ?",
    noAccount: "Pas encore de compte ?", create: "Créer un compte", haveAccount: "Déjà un compte ?",
    signupTitle: "Créer ton compte ROMKADE", name: "Prénom ou pseudo", signup: "Créer mon compte",
    rules: "10 caractères minimum, avec une majuscule, une minuscule et un chiffre.",
    terms: 'J\'accepte les <a href="https://romkade.com/mentions-legales/" target="_blank" rel="noopener">conditions d\'utilisation</a> et la <a href="https://romkade.com/confidentialite/" target="_blank" rel="noopener">politique de confidentialité</a>.',
    verifyTitle: "Vérifie ton e-mail", verifySub: "Saisis le code à 6 chiffres envoyé à {email}.", code: "Code",
    verify: "Valider", resend: "Renvoyer le code", resendIn: "Renvoyer le code dans {s} s", resent: "Nouveau code envoyé.",
    forgotTitle: "Mot de passe oublié", forgotSub: "Saisis ton adresse : tu recevras un code pour choisir un nouveau mot de passe.",
    sendCode: "Recevoir un code", resetTitle: "Nouveau mot de passe", newPassword: "Nouveau mot de passe", save: "Enregistrer",
    mfaTitle: "Double authentification", mfaSub: "Saisis le code à 6 chiffres affiché par ton application d'authentification.",
    consentTitle: "Autoriser l'accès", consentSub: "{client} demande l'accès à ton compte ROMKADE.",
    willBeAble: "{client} pourra :", perm1: "voir tes consoles et la liste de tes jeux", perm2: "lancer et quitter un jeu, régler le son, sauvegarder ta partie",
    perm3: "afficher les codes de triche de tes jeux", allow: "Autoriser", deny: "Refuser", signedAs: "Connecté : {email}",
    switchAccount: "Changer de compte", redirecting: "Retour à {client}…", missing: "Lien d'autorisation incomplet. Recommence la connexion depuis ChatGPT ou Claude.",
    expired: "Cette demande a expiré. Recommence la connexion depuis ChatGPT ou Claude.", back: "Retour",
    errors: { invalid_credentials: "E-mail ou mot de passe incorrect.", email_not_confirmed: "E-mail non vérifié : saisis le code reçu.",
      user_already_exists: "Un compte existe déjà avec cet e-mail : connecte-toi.", weak_password: "Mot de passe trop faible : 10 caractères, majuscule, minuscule et chiffre.",
      otp_expired: "Code incorrect ou expiré.", over_email_send_rate_limit: "Trop d'e-mails envoyés : patiente un peu avant de réessayer.",
      mfa_verification_failed: "Code incorrect.", terms: "Accepte les conditions pour créer ton compte." },
    rights: "© 2026 ROMKADE · Tous droits réservés",
  },
  en: {
    signinTitle: "Sign in to ROMKADE", signinSub: "Sign in to connect your console to {client}.",
    email: "Email address", password: "Password", signin: "Sign in", forgot: "Forgot password?",
    noAccount: "No account yet?", create: "Create an account", haveAccount: "Already have an account?",
    signupTitle: "Create your ROMKADE account", name: "First name or nickname", signup: "Create my account",
    rules: "At least 10 characters, with an uppercase letter, a lowercase letter and a digit.",
    terms: 'I accept the <a href="https://romkade.com/mentions-legales/" target="_blank" rel="noopener">terms of use</a> and the <a href="https://romkade.com/confidentialite/" target="_blank" rel="noopener">privacy policy</a>.',
    verifyTitle: "Check your email", verifySub: "Enter the 6-digit code sent to {email}.", code: "Code",
    verify: "Confirm", resend: "Resend the code", resendIn: "Resend the code in {s} s", resent: "New code sent.",
    forgotTitle: "Forgot password", forgotSub: "Enter your email: you will get a code to choose a new password.",
    sendCode: "Get a code", resetTitle: "New password", newPassword: "New password", save: "Save",
    mfaTitle: "Two-factor authentication", mfaSub: "Enter the 6-digit code shown by your authenticator app.",
    consentTitle: "Allow access", consentSub: "{client} is asking for access to your ROMKADE account.",
    willBeAble: "{client} will be able to:", perm1: "see your consoles and your game list", perm2: "launch and quit games, set the volume, save your progress",
    perm3: "show cheat codes for your games", allow: "Allow", deny: "Deny", signedAs: "Signed in: {email}",
    switchAccount: "Switch account", redirecting: "Going back to {client}…", missing: "Incomplete authorization link. Start again from ChatGPT or Claude.",
    expired: "This request has expired. Start again from ChatGPT or Claude.", back: "Back",
    errors: { invalid_credentials: "Wrong email or password.", email_not_confirmed: "Email not verified: enter the code you received.",
      user_already_exists: "An account already exists with this email: sign in.", weak_password: "Password too weak: 10 characters, uppercase, lowercase and digit.",
      otp_expired: "Wrong or expired code.", over_email_send_rate_limit: "Too many emails sent: wait a little before trying again.",
      mfa_verification_failed: "Wrong code.", terms: "Accept the terms to create your account." },
    rights: "© 2026 ROMKADE · All rights reserved",
  },
  es: {
    signinTitle: "Iniciar sesión en ROMKADE", signinSub: "Inicia sesión para conectar tu consola con {client}.",
    email: "Correo electrónico", password: "Contraseña", signin: "Iniciar sesión", forgot: "¿Olvidaste tu contraseña?",
    noAccount: "¿Aún no tienes cuenta?", create: "Crear una cuenta", haveAccount: "¿Ya tienes cuenta?",
    signupTitle: "Crea tu cuenta ROMKADE", name: "Nombre o apodo", signup: "Crear mi cuenta",
    rules: "Mínimo 10 caracteres, con una mayúscula, una minúscula y un número.",
    terms: 'Acepto las <a href="https://romkade.com/mentions-legales/" target="_blank" rel="noopener">condiciones de uso</a> y la <a href="https://romkade.com/confidentialite/" target="_blank" rel="noopener">política de privacidad</a>.',
    verifyTitle: "Revisa tu correo", verifySub: "Introduce el código de 6 cifras enviado a {email}.", code: "Código",
    verify: "Validar", resend: "Reenviar el código", resendIn: "Reenviar el código en {s} s", resent: "Nuevo código enviado.",
    forgotTitle: "Contraseña olvidada", forgotSub: "Introduce tu correo: recibirás un código para elegir una nueva contraseña.",
    sendCode: "Recibir un código", resetTitle: "Nueva contraseña", newPassword: "Nueva contraseña", save: "Guardar",
    mfaTitle: "Verificación en dos pasos", mfaSub: "Introduce el código de 6 cifras de tu aplicación de autenticación.",
    consentTitle: "Autorizar el acceso", consentSub: "{client} solicita acceso a tu cuenta ROMKADE.",
    willBeAble: "{client} podrá:", perm1: "ver tus consolas y tu lista de juegos", perm2: "iniciar y salir de juegos, ajustar el volumen, guardar tu partida",
    perm3: "mostrar trucos de tus juegos", allow: "Autorizar", deny: "Rechazar", signedAs: "Sesión: {email}",
    switchAccount: "Cambiar de cuenta", redirecting: "Volviendo a {client}…", missing: "Enlace de autorización incompleto. Vuelve a empezar desde ChatGPT o Claude.",
    expired: "Esta solicitud ha caducado. Vuelve a empezar desde ChatGPT o Claude.", back: "Volver",
    errors: { invalid_credentials: "Correo o contraseña incorrectos.", email_not_confirmed: "Correo no verificado: introduce el código recibido.",
      user_already_exists: "Ya existe una cuenta con este correo: inicia sesión.", weak_password: "Contraseña demasiado débil: 10 caracteres, mayúscula, minúscula y número.",
      otp_expired: "Código incorrecto o caducado.", over_email_send_rate_limit: "Demasiados correos enviados: espera un poco antes de reintentar.",
      mfa_verification_failed: "Código incorrecto.", terms: "Acepta las condiciones para crear tu cuenta." },
    rights: "© 2026 ROMKADE · Todos los derechos reservados",
  },
};
const lang = ((navigator.language || "fr").slice(0, 2).toLowerCase() in TEXT) ? navigator.language.slice(0, 2).toLowerCase() : "en";
document.documentElement.lang = lang;
const T = TEXT[lang];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => esc(v[k] ?? ""));
document.getElementById("foot").innerHTML = `${esc(T.rights)} · <a href="https://romkade.com" target="_blank" rel="noopener">romkade.com</a>`;

/* ---------- Supabase ---------- */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "romkade-auth" },
});
let details = null;      // demande d'autorisation (client, portées)
let pendingEmail = "";   // e-mail en cours de vérification

function clientName() { return details?.client?.client_name || details?.client?.name || "ChatGPT / Claude"; }
function errorText(e) {
  const code = e?.code || e?.error_code || "";
  if (T.errors[code]) return T.errors[code];
  if (/invalid login/i.test(e?.message || "")) return T.errors.invalid_credentials;
  if (/expired|invalid.*otp|token has expired/i.test(e?.message || "")) return T.errors.otp_expired;
  return e?.message || String(e);
}
function notice(text, kind = "err") {
  const el = card.querySelector(".notice-slot");
  if (el) el.innerHTML = text ? `<div class="notice notice--${kind}">${esc(text)}</div>` : "";
}
function busy(form, on) { form.querySelectorAll("button, input").forEach((el) => { el.disabled = on; }); }
function view(html) { card.innerHTML = html; const f = card.querySelector("input"); if (f) f.focus(); }

/* ---------- vues ---------- */
function showSignin(prefill = "") {
  view(`<h1>${esc(T.signinTitle)}</h1><p class="muted">${fill(T.signinSub, { client: clientName() })}</p>
    <form id="f"><label for="e">${esc(T.email)}</label><input id="e" type="email" autocomplete="username" required value="${esc(prefill)}">
    <label for="p">${esc(T.password)}</label><input id="p" type="password" autocomplete="current-password" required>
    <div class="notice-slot"></div><button class="btn" type="submit">${esc(T.signin)}</button></form>
    <div class="links"><button class="link" id="forgot">${esc(T.forgot)}</button>
    <span class="muted">${esc(T.noAccount)} <button class="link" id="create">${esc(T.create)}</button></span></div>`);
  card.querySelector("#forgot").onclick = () => showForgot(card.querySelector("#e").value);
  card.querySelector("#create").onclick = () => showSignup(card.querySelector("#e").value);
  card.querySelector("#f").onsubmit = async (ev) => {
    ev.preventDefault(); const f = ev.target; busy(f, true); notice("");
    const email = f.e.value.trim();
    const { error } = await sb.auth.signInWithPassword({ email, password: f.p.value });
    busy(f, false);
    if (error) {
      if ((error.code || "") === "email_not_confirmed") { pendingEmail = email; await sb.auth.resend({ type: "signup", email }); return showVerify("signup"); }
      return notice(errorText(error));
    }
    afterSignIn();
  };
}

function showSignup(prefill = "") {
  view(`<h1>${esc(T.signupTitle)}</h1>
    <form id="f"><label for="n">${esc(T.name)}</label><input id="n" type="text" autocomplete="nickname" maxlength="40" required>
    <label for="e">${esc(T.email)}</label><input id="e" type="email" autocomplete="email" required value="${esc(prefill)}">
    <label for="p">${esc(T.password)}</label><input id="p" type="password" autocomplete="new-password" minlength="10" required>
    <div class="hint">${esc(T.rules)}</div>
    <label class="check"><input id="t" type="checkbox"> <span>${T.terms}</span></label>
    <div class="notice-slot"></div><button class="btn" type="submit">${esc(T.signup)}</button></form>
    <div class="links"><span class="muted">${esc(T.haveAccount)} <button class="link" id="signin">${esc(T.signin)}</button></span></div>`);
  card.querySelector("#signin").onclick = () => showSignin(card.querySelector("#e").value);
  card.querySelector("#f").onsubmit = async (ev) => {
    ev.preventDefault(); const f = ev.target; notice("");
    if (!f.t.checked) return notice(T.errors.terms);
    busy(f, true);
    const email = f.e.value.trim();
    const { data, error } = await sb.auth.signUp({ email, password: f.p.value,
      options: { data: { name: f.n.value.trim(), locale: lang, terms_accepted_at: new Date().toISOString() } } });
    busy(f, false);
    if (error) return notice(errorText(error));
    if (data?.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return notice(T.errors.user_already_exists);
    if (data?.session) return afterSignIn();
    pendingEmail = email; showVerify("signup");
  };
}

function resendTimer(button, send) {
  let left = RESEND_SECONDS;
  const tick = () => {
    if (left <= 0) { button.disabled = false; button.textContent = T.resend; return; }
    button.disabled = true; button.textContent = fill(T.resendIn, { s: left }); left -= 1; setTimeout(tick, 1000);
  };
  button.onclick = async () => { const { error } = await send(); if (error) notice(errorText(error)); else { notice(T.resent, "ok"); left = RESEND_SECONDS; tick(); } };
  tick();
}

function codeForm(title, sub, extra = "") {
  return `<h1>${esc(title)}</h1><p class="muted">${sub}</p>
    <form id="f"><label for="c">${esc(T.code)}</label>
    <input id="c" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
    ${extra}<div class="notice-slot"></div><button class="btn" type="submit">${esc(T.verify)}</button></form>`;
}

function showVerify(type) {
  view(codeForm(T.verifyTitle, fill(T.verifySub, { email: pendingEmail }),) +
    `<div class="links"><button class="link" id="resend"></button><button class="link" id="back">${esc(T.back)}</button></div>`);
  resendTimer(card.querySelector("#resend"), () => sb.auth.resend({ type, email: pendingEmail }));
  card.querySelector("#back").onclick = () => showSignin(pendingEmail);
  card.querySelector("#f").onsubmit = async (ev) => {
    ev.preventDefault(); const f = ev.target; busy(f, true); notice("");
    const { error } = await sb.auth.verifyOtp({ email: pendingEmail, token: f.c.value.trim(), type });
    busy(f, false);
    if (error) return notice(errorText(error));
    afterSignIn();
  };
}

function showForgot(prefill = "") {
  view(`<h1>${esc(T.forgotTitle)}</h1><p class="muted">${esc(T.forgotSub)}</p>
    <form id="f"><label for="e">${esc(T.email)}</label><input id="e" type="email" autocomplete="email" required value="${esc(prefill)}">
    <div class="notice-slot"></div><button class="btn" type="submit">${esc(T.sendCode)}</button></form>
    <div class="links"><button class="link" id="back">${esc(T.back)}</button></div>`);
  card.querySelector("#back").onclick = () => showSignin(card.querySelector("#e").value);
  card.querySelector("#f").onsubmit = async (ev) => {
    ev.preventDefault(); const f = ev.target; busy(f, true); notice("");
    pendingEmail = f.e.value.trim();
    const { error } = await sb.auth.resetPasswordForEmail(pendingEmail);
    busy(f, false);
    if (error) return notice(errorText(error));
    showReset();
  };
}

function showReset() {
  view(codeForm(T.resetTitle, fill(T.verifySub, { email: pendingEmail }),
      `<label for="p">${esc(T.newPassword)}</label><input id="p" type="password" autocomplete="new-password" minlength="10" required><div class="hint">${esc(T.rules)}</div>`) +
    `<div class="links"><button class="link" id="resend"></button><button class="link" id="back">${esc(T.back)}</button></div>`);
  resendTimer(card.querySelector("#resend"), () => sb.auth.resetPasswordForEmail(pendingEmail));
  card.querySelector("#back").onclick = () => showSignin(pendingEmail);
  card.querySelector("#f").onsubmit = async (ev) => {
    ev.preventDefault(); const f = ev.target; busy(f, true); notice("");
    const { error } = await sb.auth.verifyOtp({ email: pendingEmail, token: f.c.value.trim(), type: "recovery" });
    if (error) { busy(f, false); return notice(errorText(error)); }
    const upd = await sb.auth.updateUser({ password: f.p.value });
    busy(f, false);
    if (upd.error) return notice(errorText(upd.error));
    afterSignIn();
  };
}

async function showMfa() {
  const { data } = await sb.auth.mfa.listFactors();
  const factor = (data?.totp || []).find((x) => x.status === "verified");
  if (!factor) return showConsent();
  view(codeForm(T.mfaTitle, esc(T.mfaSub)));
  card.querySelector("#f").onsubmit = async (ev) => {
    ev.preventDefault(); const f = ev.target; busy(f, true); notice("");
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: factor.id, code: f.c.value.trim() });
    busy(f, false);
    if (error) return notice(T.errors.mfa_verification_failed);
    showConsent();
  };
}

async function afterSignIn() {
  const { data } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (data && data.nextLevel === "aal2" && data.currentLevel !== "aal2") return showMfa();
  showConsent();
}

async function showConsent() {
  card.innerHTML = '<span class="spin" aria-hidden="true"></span>';
  const { data, error } = await sb.auth.oauth.getAuthorizationDetails(authorizationId);
  if (error) return view(`<h1>${esc(T.consentTitle)}</h1><div class="notice notice--err">${esc(T.expired)}</div>`);
  details = data;
  if (data?.redirect_url && !data.authorization_id) { return go(data.redirect_url); }  // déjà autorisé
  const { data: u } = await sb.auth.getUser();
  const email = u?.user?.email || "";
  const logo = data?.client?.logo_uri ? `<img src="${esc(data.client.logo_uri)}" alt="">` : `<img src="/icon-192.webp" alt="">`;
  view(`<h1>${esc(T.consentTitle)}</h1><p class="muted">${fill(T.consentSub, { client: clientName() })}</p>
    <div class="client">${logo}<div><b>${esc(clientName())}</b><span class="muted">${esc(data?.client?.client_uri || data?.redirect_uri || "")}</span></div></div>
    <p class="muted" style="margin:0">${fill(T.willBeAble, { client: clientName() })}</p>
    <ul class="perms"><li>${esc(T.perm1)}</li><li>${esc(T.perm2)}</li><li>${esc(T.perm3)}</li></ul>
    <div class="notice-slot"></div>
    <div class="row"><button class="btn btn--ghost" id="deny">${esc(T.deny)}</button><button class="btn" id="allow">${esc(T.allow)}</button></div>
    <div class="account"><span>${fill(T.signedAs, { email })}</span><button class="link" id="switch">${esc(T.switchAccount)}</button></div>`);
  card.querySelector("#allow").onclick = () => decide("approve");
  card.querySelector("#deny").onclick = () => decide("deny");
  card.querySelector("#switch").onclick = async () => { await sb.auth.signOut(); showSignin(); };
}

async function decide(action) {
  card.querySelectorAll("button").forEach((b) => { b.disabled = true; });
  const call = action === "approve" ? sb.auth.oauth.approveAuthorization : sb.auth.oauth.denyAuthorization;
  const { data, error } = await call.call(sb.auth.oauth, authorizationId, { skipBrowserRedirect: true });
  if (error) { card.querySelectorAll("button").forEach((b) => { b.disabled = false; }); return notice(errorText(error)); }
  go(data.redirect_url);
}

function go(url) {
  view(`<h1>${fill(T.redirecting, { client: clientName() })}</h1><span class="spin" aria-hidden="true"></span>`);
  window.location.assign(url);
}

/* ---------- démarrage ---------- */
(async () => {
  if (!authorizationId) return view(`<h1>ROMKADE</h1><div class="notice notice--err">${esc(T.missing)}</div>`);
  const { data } = await sb.auth.getSession();
  if (data?.session) return afterSignIn();
  showSignin();
})();
})();
</script>
</body>
</html>
