# Extension Docker Desktop de ROMKADE Manager (amd64 + arm64 : Docker Desktop pour Windows, macOS Intel et Apple
# Silicon, Linux), publiée sur ghcr.io/romkade/romkade-manager-extension et sur Docker Hub
# (<DOCKERHUB_USERNAME>/romkade-manager-extension, l'image que lit le Marketplace de Docker Desktop).
#   push sur main (dossier docker-extension) : « edge », qui lance le Manager « edge » (dernier état de main)
#   tag vX.Y.Z : « X.Y.Z » et « latest », qui lancent le Manager de la même version
#   lancement manuel avec une version (0.5.0) : republie cette version, par exemple après un changement de l'extension
# Secrets du dépôt : DOCKERHUB_USERNAME et DOCKERHUB_TOKEN (jeton Docker Hub « Read & Write »).
name: Extension Docker Desktop

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths: ["docker-extension/**", ".github/workflows/docker-extension.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version du Manager à publier (0.5.0) ; vide : edge"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version publiée et Manager lancé par l'extension
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${INPUT_VERSION#v}"; fi
          if [ -n "$VERSION" ]; then
            echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version invalide : $VERSION"; exit 1; }
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"; echo "manager=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"; echo "manager=edge" >> "$GITHUB_OUTPUT"
          fi
      - name: Fichiers de l'image
        run: docker-extension/build.sh --context ext --manager-image ghcr.io/romkade/romkade-manager:${{ steps.v.outputs.manager }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}-extension
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/romkade-manager-extension
          tags: |
            type=raw,value=edge,enable=${{ steps.v.outputs.version == '' }}
            type=raw,value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.v.outputs.version != '' }}
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: ext
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Les étiquettes de l'extension (titre, description, icône…) viennent de son Dockerfile.
