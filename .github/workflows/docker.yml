# Image Docker de ROMKADE Manager sur ghcr.io/romkade/romkade-manager (amd64 + arm64).
# À chaque push sur main : « edge » ; à chaque tag vX.Y.Z : « X.Y.Z », « X.Y » et « latest ».
name: Image Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Un tag doit porter le numéro de version du code : l'interface et l'image affichent la même version.
      - name: Tag et version du code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CODE=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml)
          [ "v$CODE" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME, mais backend/pyproject.toml dit $CODE"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Variable du dépôt POSTHOG_KEY (clé publique phc_…) : statistiques anonymes, sur accord de l'utilisateur.
          build-args: |
            VITE_POSTHOG_KEY=${{ vars.POSTHOG_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tout l'historique et les tags : les nouveautés depuis la version précédente
      # compose.yaml de l'utilisateur : l'image publiée, sans la ligne « build: . » qui sert au développement.
      - name: compose.yaml de la release
        run: |
          mkdir -p out
          sed '/^    build: \.$/d' compose.yaml > out/compose.yaml
          ! grep -q 'build:' out/compose.yaml
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Nouveautés = sujets des commits depuis le tag précédent (tout l'historique pour la première version).
          # Le site romkade.com/notes-de-version affiche cette section (« ## Nouveautés »), lue sur GitHub au build.
          PREV=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Nouveautés"
            echo
            git log --no-merges --pretty='- %s' ${PREV:+"$PREV.."}"$GITHUB_REF_NAME"
            echo
            echo "## Installer ou mettre à jour"
            echo
          } > out/notes.md
          cat >> out/notes.md <<EOF
          Image : \`ghcr.io/romkade/romkade-manager:$VERSION\` (aussi \`latest\`), macOS, Windows et Linux, Intel/AMD et ARM.

          Installer : dans un dossier vide,

          \`\`\`
          curl -fsSLO https://github.com/RomKade/romkade-manager/releases/latest/download/compose.yaml
          docker compose up -d
          \`\`\`

          puis ouvrir http://localhost:8765. Mettre à jour : \`docker compose pull && docker compose up -d\`.
          Guide complet : https://romkade.com/docs/getting-started/installation/
          EOF
          gh release create "$GITHUB_REF_NAME" out/compose.yaml --title "ROMKADE Manager $VERSION" \
            --notes-file out/notes.md --generate-notes --verify-tag
      # romkade.com se reconstruit pour afficher la nouvelle version et ses notes (sinon : au plus tard la nuit
      # suivante). Jeton facultatif SITE_DISPATCH_TOKEN : accès « Contents: read and write » au dépôt du site.
      - name: Prévenir romkade.com
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SITE_DISPATCH_TOKEN absent : le site se mettra à jour cette nuit."; exit 0; fi
          gh api repos/arnoweb/romkade-website/dispatches -f event_type=manager-release \
            -F "client_payload[tag]=$GITHUB_REF_NAME"

  # L'installation telle que la fait un utilisateur, avec le compose.yaml de la release et l'image publiée
  # (une release créée par GITHUB_TOKEN ne déclenche pas d'autre workflow : appel direct).
  verify:
    needs: release
    uses: ./.github/workflows/install-test.yml
    with:
      tag: ${{ github.ref_name }}
