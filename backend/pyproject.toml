[project]
name = "anbernic-game-manager"
version = "0.5.0"
description = "Gestionnaire local des jeux d'une Anbernic RG35XX Pro (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncssh>=2.17",
    "keyring>=25",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pillow>=10",
    "httpx>=0.27",  # recherche YouTube (certificats via certifi)
    "segno>=1.6",
    "anthropic>=1.15",  # descriptions des jeux (scripts/descriptions.py)  # QR code de l'adresse « ./run.sh --telephone »
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.gz", "device/*.sh", "db/migrations/*.py", "db/migrations/versions/*.py"]
